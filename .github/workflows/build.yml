name: Build and Release

on:
  push:
    branches: [ main, feature/agent ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.9'
        
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libgtest-dev
        
    - name: Clean previous builds
      run: |
        rm -rf build dist native/build
        mkdir -p build dist/bin dist/lib native/build
        
    - name: Build Go binary
      run: |
        export GOTOOLCHAIN=local
        CGO_ENABLED=0 go build -ldflags="-s -w" -o build/jvmtool ./cmd
        cp build/jvmtool dist/bin/
        chmod +x dist/bin/jvmtool
        
    - name: Build native agent library
      run: |
        cd native/build
        cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=ON -DENABLE_COVERAGE=OFF
        make -j$(nproc) jvmtool-agent
        cp jvmtool-agent.so ../../dist/lib/ || cp libjvmtool-agent.so ../../dist/lib/jvmtool-agent.so
        
    - name: Run tests
      run: |
        cd native/build
        make jvmtool-agent-test
        ctest --output-on-failure
        
    - name: Create package
      run: |
        ARCH=$(uname -m)
        OS=$(uname -s)
        PACKAGE_NAME="jvmtool-${OS}-${ARCH}.tar.gz"
        cd dist
        tar -czf "../build/$PACKAGE_NAME" bin/ lib/
        cd ..
        echo "$(sha256sum build/$PACKAGE_NAME | cut -d' ' -f1)" > "build/${PACKAGE_NAME}.sha256"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: jvmtool-linux-x86_64
        path: |
          build/jvmtool-Linux-*.tar.gz
          build/jvmtool-Linux-*.sha256
          
  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.24.9'
        
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Install build dependencies
      run: |
        brew install cmake googletest
        
    - name: Clean previous builds
      run: |
        rm -rf build dist native/build
        mkdir -p build dist/bin dist/lib native/build
        
    - name: Build Go binary
      run: |
        export GOTOOLCHAIN=local
        CGO_ENABLED=0 go build -ldflags="-s -w" -o build/jvmtool ./cmd
        cp build/jvmtool dist/bin/
        chmod +x dist/bin/jvmtool
        
    - name: Build native agent library
      run: |
        cd native/build
        cmake .. -DCMAKE_BUILD_TYPE=RelWithDebInfo -DBUILD_TESTS=ON -DENABLE_COVERAGE=OFF
        make -j$(sysctl -n hw.ncpu) jvmtool-agent
        cp jvmtool-agent.dylib ../../dist/lib/ || cp libjvmtool-agent.dylib ../../dist/lib/jvmtool-agent.dylib
        
    - name: Run tests
      run: |
        cd native/build
        make jvmtool-agent-test
        ctest --output-on-failure
        
    - name: Create package
      run: |
        ARCH=$(uname -m)
        OS=$(uname -s)
        PACKAGE_NAME="jvmtool-${OS}-${ARCH}.tar.gz"
        cd dist
        tar -czf "../build/$PACKAGE_NAME" bin/ lib/
        cd ..
        shasum -a 256 "build/$PACKAGE_NAME" | cut -d' ' -f1 > "build/${PACKAGE_NAME}.sha256"
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v3
      with:
        name: jvmtool-macos-x86_64
        path: |
          build/jvmtool-Darwin-*.tar.gz
          build/jvmtool-Darwin-*.sha256
          
  release:
    name: Create Release
    needs: [build-linux, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - name: Download Linux artifacts
      uses: actions/download-artifact@v3
      with:
        name: jvmtool-linux-x86_64
        path: artifacts/linux
        
    - name: Download macOS artifacts
      uses: actions/download-artifact@v3
      with:
        name: jvmtool-macos-x86_64
        path: artifacts/macos
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          artifacts/linux/*
          artifacts/macos/*
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
